name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Static check (ruff, light)
        run: ruff check --select E9,F tools/
      - name: Doc consistency check
        run: python tools/doc_check.py
      - name: Run self-tests (twenty-one suites)
        run: |
          set -e
          for f in tools/tests/test_*.py; do
            echo "== $f"
            python "$f"
          done
      - name: Run bench probe pack (eleven pieces)
        run: python tools/bench_run.py
