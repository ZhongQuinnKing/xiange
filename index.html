<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弦歌 xiange</title>
<style>
  :root {
    --ink: #2b2620;
    --ink-soft: #6b6257;
    --paper: #faf8f4;
    --gold: #a8874e;
    --hair: #e6e0d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.9 "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 18vh 28px 16vh;
  }
  h1 {
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 0.18em;
    margin: 0 0 6px;
  }
  .rule {
    width: 56px;
    height: 2px;
    background: var(--gold);
    margin: 18px 0 26px;
  }
  .sub {
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    margin: 0 0 28px;
  }
  .intro { margin: 0 0 30px; }
  ul.links {
    list-style: none;
    padding: 0;
    margin: 0 0 34px;
    border-top: 1px solid var(--hair);
  }
  ul.links li { border-bottom: 1px solid var(--hair); }
  ul.links a {
    display: block;
    padding: 12px 2px;
    color: var(--ink);
    text-decoration: none;
  }
  ul.links a:hover { color: var(--gold); }
  .sisters {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 10px;
  }
  .lic {
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 0.04em;
    margin: 0;
  }
</style>
</head>
<body>
<main>
  <h1>弦歌</h1>
  <div class="rule"></div>
  <p class="sub">给主流 AI 用的音乐能力包</p>
  <p class="intro">一个真实的钢琴编配项目全程走通（选曲／取源／转谱／出谱），产出全部归本包。项目本身不是成果，这套可复用的流程与工具才是。</p>
  <ul class="links">
    <li><a href="https://github.com/ZhongQuinnKing/xiange">仓库与文档</a></li>
    <li><a href="https://github.com/ZhongQuinnKing/xiange/blob/main/docs/10-%E8%83%BD%E5%8A%9B%E7%8A%B6%E6%80%81.md">能力状态</a></li>
    <li><a href="https://github.com/ZhongQuinnKing/xiange/blob/main/docs/06-%E8%AF%84%E6%B5%8B%E5%8F%A3%E5%BE%84.md">评测口径</a></li>
    <li><a href="https://github.com/ZhongQuinnKing/xiange/blob/main/CHANGELOG.md">更新日志</a></li>
  </ul>
  <p class="sisters">姊妹篇：采诗读互联网、拾级陪人、玉尺量文章、弦歌弄音乐。</p>
  <p class="lic">内容 CC BY-NC-ND 4.0 ｜ 代码 MIT</p>
</main>
</body>
</html>
